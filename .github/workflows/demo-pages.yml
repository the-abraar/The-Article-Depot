name: Demo page

# Manual only. Publishes demo/ (a static, honest status page) to GitHub Pages.
# It never runs the pipeline and needs no API key. Pages -> Source must be
# "GitHub Actions". Note: the paused "Daily publish" workflow deploys site/
# to the same Pages site; whichever deploys last is what visitors see.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo
      - id: deploy
        uses: actions/deploy-pages@v4
